cameras:
  - id: cam_01
    name: Main Entrance
    source: ./media/test_cctv.mp4   # replace with RTSP URL for live camera

    zones:
      - id: zone_entrance_gate
        name: Entry Gate (Stationary Spot)
        # Small hotspot — only the doorway area. Person must literally stand here to trigger loitering.
        polygon:
          - [60,  390]
          - [200, 390]
          - [200, 480]
          - [60,  480]
        rules:
          - type: loitering
            threshold_seconds: 5    # fire after 5s standing still in this tiny spot
            enabled: true
          - type: intrusion
            active_hours: "22:00-06:00"
            enabled: true

      - id: zone_atm
        name: ATM Corner
        # Tight corner — person must stand near ATM, not walk past it.
        polygon:
          - [440, 80]
          - [620, 80]
          - [620, 220]
          - [440, 220]
        rules:
          - type: loitering
            threshold_seconds: 5
            enabled: true
          - type: crowd
            max_persons: 3
            enabled: true

    trailing:
      duration_threshold: 2         # seconds person B must follow person A (short for demo videos)
      max_ambient_persons: 8        # allow more people before suppressing
      min_follow_distance: 20       # min pixels gap between leader and follower
      max_follow_distance: 380      # max pixels gap — wide to catch video-scale distances

    # Feature A: Abandoned / Unaccompanied Person Detection
    unaccompanied:
      enabled: true
      threshold_seconds: 45        # seconds small-stature person is alone without adult
      proximity_radius_px: 150     # max distance in pixels to count as accompanied
      adult_height_px: 160         # baseline adult height reference at standard depth
      small_stature_ratio: 0.68    # < 68% height classified as small-stature proxy

    # Feature B: Sound-Based Distress Detection
    audio_distress:
      enabled: true
      confidence_threshold: 0.55
      sample_rate: 16000
      temporal_smoothing_windows: 3 # 2 of 3 consecutive windows
